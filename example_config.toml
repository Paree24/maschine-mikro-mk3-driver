# Chord voicings per scale: "power" (root+fifth), "triad" (1-3-5), "tetrad" (1-3-5-7)
# Default: 7-tone -> triad, non-7 (chromatic 12, pentatonic 5, blues 6) -> power (fixed 7 semitones, straightforward)
# Override here to make pentatonic triads/tetrads, chromatic tetrads, etc.
[chord_types]
